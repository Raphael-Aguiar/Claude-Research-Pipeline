# Defaults por modalidade — carregados automaticamente quando
# o scope.yaml não define um valor explícito.
#
# Bases automáticas: pubmed, openalex, semantic_scholar, europe_pmc.
# LILACS/SciELO: a API da BVS é de uso interno da BIREME (sem chave pública
# — docs.api.bvsalud.org, 2026-07-15). Caminho legítimo: buscar no portal
# https://pesquisa.bvsalud.org (navegador), exportar RIS e importar com
# `python -m tools import-ris`. Cobertura SciELO parcial via OpenAlex (DOIs).

pesquisa-base:
  apis: ["pubmed", "openalex"]
  max_results_per_api: 100
  max_final_refs: 40
  year_range: [2020, 2026]
  languages: ["en", "pt"]

revisao-integrativa:
  apis: ["pubmed", "openalex", "semantic_scholar", "europe_pmc"]
  max_results_per_api: 300
  max_final_refs: 80
  year_range: [2015, 2026]
  languages: ["en", "pt", "es"]
  quality_framework: "MMAT/CASP"

# Revisão sistemática exige ≥3 bases documentadas (Cochrane MECIR).
# Para temas brasileiros/latino-americanos, complementar com LILACS via
# portal BVS + import-ris (ver cabeçalho).
revisao-sistematica:
  apis: ["pubmed", "openalex", "semantic_scholar", "europe_pmc"]
  max_results_per_api: 500
  max_final_refs: 200
  year_range: [2010, 2026]
  languages: ["en", "pt", "es"]
  quality_framework: "RoB 2 / GRADE"

revisao-escopo:
  apis: ["pubmed", "openalex", "semantic_scholar", "europe_pmc"]
  max_results_per_api: 500
  max_final_refs: 200
  year_range: [2010, 2026]
  languages: ["en", "pt", "es"]
  quality_framework: "PRISMA-ScR (avaliação de qualidade não requerida — JBI)"

# Meta-revisão (umbrella review / overview of reviews): só inclui revisões.
# PubMed recebe filtro systematic[sb]/review[pt]/meta-analysis[pt] automático;
# a triagem descarta o que não é revisão (relevance_method=nao_e_revisao).
meta-revisao:
  apis: ["pubmed", "openalex", "semantic_scholar", "europe_pmc"]
  max_results_per_api: 500
  max_final_refs: 100
  year_range: [2010, 2026]
  languages: ["en", "pt", "es"]
  quality_framework: "AMSTAR-2 (qualidade das revisões incluídas) + PRIOR (relato)"
